spring.application.name=Facilitybook

# Datasource (defaults target the docker-compose Postgres mapped to host port 5433)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/facilitybook}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:facilitybook}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:facilitybook}
# Schema is managed by Flyway (db/migration); Hibernate only validates
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
