spring.application.name=Facilitybook

# Datasource (defaults target the docker-compose Postgres mapped to host port 5433)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/facilitybook}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:facilitybook}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:facilitybook}
# Schema is managed by Flyway (db/migration); Hibernate only validates
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# JWT (override via environment variables in real deployments)
app.jwt.secret=${APP_JWT_SECRET:facilitybook-dev-secret-key-change-me-0123456789}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}

# Frontend origins allowed by CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Timezone used to interpret operating hours and to group report data
app.timezone=${APP_TIMEZONE:UTC}

# Reservation reminders (in-app). 0 disables the scheduled reminder job.
app.reminders.enabled=${APP_REMINDERS_ENABLED:true}
app.reminders.interval-ms=${APP_REMINDERS_INTERVAL_MS:3600000}
app.reminders.horizon-hours=${APP_REMINDERS_HORIZON_HOURS:24}

# Pagination guard rails
spring.data.web.pageable.max-page-size=100
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
