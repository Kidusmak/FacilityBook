# FacilityBook local stack: PostgreSQL 16 + Spring Boot API.
# Copy .env.example to .env to override any value (credentials, ports, JWT secret).
# Defaults are safe for local demo use; host Postgres port defaults to 5433 to
# avoid clashing with a local PostgreSQL that commonly already uses 5432.
# Pin the project name so container/volume/network names stay stable even if the
# repository folder is renamed.
name: facilitybook
services:
  db:
    image: postgres:16-alpine
    container_name: facilitybook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facilitybook}
      POSTGRES_USER: ${POSTGRES_USER:-facilitybook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facilitybook}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - facilitybook-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facilitybook} -d ${POSTGRES_DB:-facilitybook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: facilitybook-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-facilitybook}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-facilitybook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-facilitybook}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # Override in .env for anything but a local demo. Keep this a long random value.
      APP_JWT_SECRET: ${APP_JWT_SECRET:-facilitybook-dev-secret-key-change-me-0123456789}
      APP_JWT_EXPIRATION_MINUTES: ${APP_JWT_EXPIRATION_MINUTES:-60}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Operating hours are local wall-clock times; keep this equal to TZ so
      # "08:00-18:00" means the same thing to the API and to log timestamps.
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Istanbul}
      TZ: ${APP_TIMEZONE:-Europe/Istanbul}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"

volumes:
  facilitybook-db-data:
